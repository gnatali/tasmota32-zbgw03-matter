; Tasmota pour la passerelle eWeLink ZB-GW03 (ESP32, Ethernet LAN8720, Zigbee EFR32MG21) : Zigbee + Matter
; Zigbee en EZSP : voir user_config_override.h (copie dans tasmota/)
; A copier a la racine du depot Tasmota (branche development, 16.0.0.x)
; Compilation : pio run -e tasmota32-zbgw03-matter

[platformio]
default_envs            = tasmota32-zbgw03-matter

[env:tasmota32-zbgw03-matter]
; Reprend le build officiel ZBBridge Pro (Zigbee, Ethernet, TCP bridge...), le module
; Zigbee etant passe en EZSP par user_config_override.h
extends                 = env:tasmota32-zbbrdgpro
; Meme table de partitions que le module actuel (safeboot 832K / app0 2880K / fs 320K) :
; l'image Matter (~2 Mo, 2050 Ko avec le driver Tuya) ne tiendrait pas dans le app1856k du build officiel
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
; build_flags redefinis (et non etendus) pour ne pas heriter de l'OTA_URL officiel,
; qui reinstallerait un firmware sans Matter au prochain "Start upgrade" : l'OTA pointe
; sur la derniere release de ce depot (appliquee sur le module par la commande "OtaUrl 1")
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_ZBBRDGPRO
                          -DUSE_MATTER_DEVICE
                          -DCODE_IMAGE_STR='"zbgw03-matter"'
                          -DOTA_URL='"https://github.com/gnatali/tasmota32-zbgw03-matter/releases/latest/download/tasmota32-zbgw03-matter.bin"'
; Driver Tuya local solidifie dans le firmware : son code est en flash et non plus compile en
; RAM au chargement. Chemin relatif au depot Tasmota (PROJECT_DIR) : le workflow clone Tasmota
; dans tasmota/ a l'interieur de ce depot. Les cinq classes sont enregistrees grace au
; correctif patches/berry-solidify-all-classes.patch. Instanciation dans autoexec.be.
custom_berry_solidify   = ../berry/tuya_local.be
; Le firmware CC2652 et les scripts de flash du build officiel ne tiennent pas
; dans le systeme de fichiers de 320K, et sont inutiles pour une mise a jour OTA
custom_files_upload     = no_files
; Le build officiel retire espressif/mdns, indispensable a Matter (annonce _matter._tcp) :
; on le garde. fb_gfx (camera, inutile sur le ZB-GW03) est retire
custom_component_remove = espressif/esp-dsp
                          espressif/esp_modem
                          espressif/esp32-camera
                          espressif/fb_gfx
