; Tasmota for the eWeLink ZB-GW03 gateway (ESP32, LAN8720 Ethernet, EFR32MG21 Zigbee): Zigbee + Matter
; Zigbee in EZSP: see user_config_override.h (copied into tasmota/)
; To be copied to the root of the Tasmota repository (development branch, 16.0.0.x)
; Build: pio run -e tasmota32-zbgw03-matter

[platformio]
default_envs            = tasmota32-zbgw03-matter

[env:tasmota32-zbgw03-matter]
; Based on the official ZBBridge Pro build (Zigbee, Ethernet, TCP bridge...), with the Zigbee
; module switched to EZSP by user_config_override.h
extends                 = env:tasmota32-zbbrdgpro
; Same partition table as the current module (safeboot 832K / app0 2880K / fs 320K): the Matter
; image (~2 MB, 2050 KB with the Tuya driver) would not fit in the official build's app1856k
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
; build_flags redefined (not extended) so as not to inherit the official OTA_URL, which would
; reinstall a firmware without Matter at the next "Start upgrade": the OTA points to this
; repository's latest release (applied on the module with the "OtaUrl 1" command)
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_ZBBRDGPRO
                          -DUSE_MATTER_DEVICE
                          -DCODE_IMAGE_STR='"zbgw03-matter"'
                          -DOTA_URL='"https://github.com/gnatali/tasmota32-zbgw03-matter/releases/latest/download/tasmota32-zbgw03-matter.bin"'
; Local Tuya driver solidified into the firmware: its code is in flash instead of being compiled
; into RAM when loaded. Path relative to the Tasmota repository (PROJECT_DIR): the workflow
; clones Tasmota into tasmota/ inside this repository. All the classes are registered thanks to
; the patches/berry-solidify-all-classes.patch patch. Instantiated in autoexec.be.
custom_berry_solidify   = ../berry/tuya_local.be
; The official build's CC2652 firmware and flash scripts do not fit in the 320K file system,
; and are useless for an OTA update
custom_files_upload     = no_files
; The official build removes espressif/mdns, which Matter needs (_matter._tcp announcement):
; it is kept. fb_gfx (camera, useless on the ZB-GW03) is removed
custom_component_remove = espressif/esp-dsp
                          espressif/esp_modem
                          espressif/esp32-camera
                          espressif/fb_gfx
