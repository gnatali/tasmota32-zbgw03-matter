name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Reference Tasmota commit (development branch, 16.0.0.3)
  TASMOTA_REF: 43d9409e67c4a28adac34925e1a1c6813f315ce0
  PIO_ENV: tasmota32-zbgw03-matter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: ${{ env.TASMOTA_REF }}
          path: tasmota

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.TASMOTA_REF }}

      - run: pip install platformio tinytuya

      # Tests of the tuya_local.be Berry driver: Tasmota's Berry interpreter and BearSSL, fake
      # Tuya devices built on TinyTuya (the test writes /tuya.json, /tuya.json.bak, /devices.json
      # and /tuya_cloud.json). Run on the source driver, then on the driver solidified as in the
      # build (custom_berry_solidify)
      - run: |
          sudo touch /tuya.json /tuya.json.bak /devices.json /tuya_cloud.json
          sudo chmod 666 /tuya.json /tuya.json.bak /devices.json /tuya_cloud.json
          bash berry/test/run_tests.sh tasmota

      - run: |
          cp platformio_override.ini tasmota/
          cp user_config_override.h tasmota/tasmota/

      # Patches applied to Tasmota's code (patches/*.patch). Matter's Berry code is regenerated
      # from the .be sources during compilation: a patch to a .be file is therefore taken into
      # account.
      - run: |
          for p in patches/*.patch; do
            git -C tasmota apply --verbose "../$p"
          done

      - run: pio run -e ${{ env.PIO_ENV }}
        working-directory: tasmota

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: tasmota/build_output/firmware/${{ env.PIO_ENV }}*

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # .bin: update (file or OTA); .factory.bin: first installation through the serial
          # port, at address 0x0
          files: |
            tasmota/build_output/firmware/${{ env.PIO_ENV }}.bin
            tasmota/build_output/firmware/${{ env.PIO_ENV }}.factory.bin
