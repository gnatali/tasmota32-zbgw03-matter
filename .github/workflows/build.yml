name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Commit Tasmota de reference (branche development, 16.0.0.2)
  TASMOTA_REF: a281cece518b0031e22f2317ca7dbc530c934da1
  PIO_ENV: tasmota32-zbgw03-matter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: ${{ env.TASMOTA_REF }}
          path: tasmota

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.TASMOTA_REF }}

      - run: pip install platformio tinytuya

      # Tests du driver Berry tuya_local.be : interpreteur Berry et BearSSL de Tasmota,
      # faux appareils Tuya construits sur TinyTuya (le test ecrit /tuya.json, /tuya.json.bak et
      # /devices.json). Joues sur le
      # driver source puis sur le driver solidifie comme au build (custom_berry_solidify)
      - run: |
          sudo touch /tuya.json /tuya.json.bak /devices.json /tuya_cloud.json
          sudo chmod 666 /tuya.json /tuya.json.bak /devices.json /tuya_cloud.json
          bash berry/test/run_tests.sh tasmota

      - run: |
          cp platformio_override.ini tasmota/
          cp user_config_override.h tasmota/tasmota/

      # Correctifs appliques au code de Tasmota (patches/*.patch). Le code Berry de Matter
      # est regenere a partir des sources .be pendant la compilation : un correctif d'un
      # fichier .be est donc bien pris en compte.
      - run: |
          for p in patches/*.patch; do
            git -C tasmota apply --verbose "../$p"
          done

      - run: pio run -e ${{ env.PIO_ENV }}
        working-directory: tasmota

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: tasmota/build_output/firmware/${{ env.PIO_ENV }}*

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # .bin : mise a jour (fichier ou OTA) ; .factory.bin : premiere installation par
          # le port serie, a l'adresse 0x0
          files: |
            tasmota/build_output/firmware/${{ env.PIO_ENV }}.bin
            tasmota/build_output/firmware/${{ env.PIO_ENV }}.factory.bin
